name: Web Journals

on:
  push:
    paths:
      - 'evileye/api/**'
      - 'evileye/api/frontend/**'
      - 'evileye/api/static/**'
      - 'evileye/visualization_modules/journal_*'
      - 'tests/unit/api/test_journal_*'
      - 'tests/unit/api/test_playback_*'
      - 'tests/unit/api/test_live_preview_acl.py'
      - 'tests/unit/api/test_reaudit_*'
      - 'evileye/api/core/playback_cache.py'
      - 'evileye/api/core/media_access.py'
      - 'evileye/api/core/playback_timeline_index.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'tests/integration/api/test_journals_smoke.py'
      - 'scripts/verify_web_journals.sh'
      - '.github/workflows/web-journals.yml'
  pull_request:
    paths:
      - 'evileye/api/**'
      - 'evileye/api/frontend/**'
      - 'evileye/api/static/**'
      - 'evileye/visualization_modules/journal_*'
      - 'tests/unit/api/test_journal_*'
      - 'tests/unit/api/test_playback_*'
      - 'tests/unit/api/test_live_preview_acl.py'
      - 'tests/unit/api/test_reaudit_*'
      - 'evileye/api/core/playback_cache.py'
      - 'evileye/api/core/media_access.py'
      - 'evileye/api/core/playback_timeline_index.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'tests/integration/api/test_journals_smoke.py'
      - 'scripts/verify_web_journals.sh'
      - '.github/workflows/web-journals.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evileye/api/frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Verify web journals and Vite SPA
        run: bash scripts/verify_web_journals.sh
