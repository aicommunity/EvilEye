name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "EvilEye version on PyPI (empty = pyproject.toml)"
        required: false
        default: ""
      push:
        description: "Push images to Docker Hub"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read(), re.M).group(1))")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved EVILEYE_VERSION=$VERSION"

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'release' || inputs.push }}
          build-args: |
            EVILEYE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            evileye/app:${{ steps.ver.outputs.version }}
            evileye/app:latest

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: ${{ github.event_name == 'release' || inputs.push }}
          build-args: |
            EVILEYE_VERSION=${{ steps.ver.outputs.version }}
            ULTRALYTICS_VERSION=8.4.115
          tags: |
            evileye/app:${{ steps.ver.outputs.version }}-cpu
            evileye/app:cpu
