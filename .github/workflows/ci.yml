name: CI

on:
  push:
    branches: [main, plugin_support]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Undefined names (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      # Blocks new F821 (undefined name) and E9 (syntax) findings; known ones live in
      # scripts/ruff_baseline.json and are removed from it as they get fixed.
      - run: python scripts/check_undefined_names.py

  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Qt and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libfontconfig1
      - name: Install CPU PyTorch and EvilEye
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -p no:cacheprovider
      - name: No leftover worker processes
        if: always()
        run: bash scripts/check_no_leftover_workers.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evileye/api/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: evileye/api/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed evileye/api/static must match the build
        working-directory: .
        run: |
          git add --intent-to-add evileye/api/static
          if ! git diff --quiet -- evileye/api/static; then
            echo "evileye/api/static is out of date. Run 'npm run build' in evileye/api/frontend and commit the result."
            git status --short evileye/api/static | head -30
            exit 1
          fi

  plugin-package-smoke:
    name: External plugin package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Qt and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1
      - name: Install CPU PyTorch and EvilEye
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Install the example plugin package (editable)
        run: pip install -e examples/plugin_package
      # smoke_pipeline.py exercises both thread and process execution modes.
      - name: Run smoke_pipeline.py
        working-directory: examples/plugin_package
        run: python smoke_pipeline.py
      - name: No leftover worker processes
        if: always()
        run: bash scripts/check_no_leftover_workers.sh
