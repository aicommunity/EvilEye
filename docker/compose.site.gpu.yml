name: evileye

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: evil_eye_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evil_eye_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    image: ${EVILEYE_IMAGE:-evileye/app:latest}
    restart: unless-stopped
    working_dir: /site
    environment:
      EVILEYE_SITE_DIR: /site
      EVILEYE_DATA_DIR: /site/EvilEyeData
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/site
    ports:
      - "${EVILEYE_HOST_PORT:-8181}:8181"
    depends_on:
      db:
        condition: service_healthy
    command: ["evileye", "server", "--host", "0.0.0.0", "--port", "8181", "--no-reload"]

  app:
    image: ${EVILEYE_IMAGE:-evileye/app:latest}
    restart: unless-stopped
    working_dir: /site
    environment:
      EVILEYE_SITE_DIR: /site
      EVILEYE_DATA_DIR: /site/EvilEyeData
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./:/site
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    command: ["evileye", "run", "configs/single_video.json", "--no-gui"]
