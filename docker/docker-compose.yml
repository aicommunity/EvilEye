# EvilEye Docker Compose stack (GPU image + Web UI + PostgreSQL)
#
# From repo root:
#   ./docker/prepare-host-dirs.sh
#   make docker-up
#   # or:
#   docker compose --project-directory . -f docker/docker-compose.yml up -d --build
#
# Defaults resolve relative to this file's directory (docker/), so site/PG paths
# point at the repository parent (..).

name: evileye

services:
  db:
    image: postgres:15-alpine
    container_name: evileye_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: evil_eye_db
    volumes:
      - ${EVILEYE_PG_DATA:-../postgres_data}:/var/lib/postgresql/data
    ports:
      - "${EVILEYE_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evil_eye_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ULTRALYTICS_TAG: "8.4.115"
        EVILEYE_VERSION: "${EVILEYE_VERSION:-}"
    image: ${EVILEYE_IMAGE:-evileye/app:latest}
    container_name: evileye_web
    restart: unless-stopped
    working_dir: /site
    environment:
      EVILEYE_SITE_DIR: /site
      EVILEYE_DATA_DIR: /site/EvilEyeData
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${EVILEYE_SITE_DIR:-..}:/site
    ports:
      - "${EVILEYE_HOST_PORT:-8181}:8181"
    depends_on:
      db:
        condition: service_healthy
    command: ["evileye", "server", "--host", "0.0.0.0", "--port", "8181", "--no-reload"]

  app:
    image: ${EVILEYE_IMAGE:-evileye/app:latest}
    container_name: evileye_app
    restart: unless-stopped
    working_dir: /site
    environment:
      EVILEYE_SITE_DIR: /site
      EVILEYE_DATA_DIR: /site/EvilEyeData
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ${EVILEYE_SITE_DIR:-..}:/site
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    command: ["evileye", "run", "configs/single_video.json", "--no-gui"]
